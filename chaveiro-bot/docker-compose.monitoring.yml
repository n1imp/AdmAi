# ── Observabilidade (opcional) ────────────────────────────────────────────────
# Prometheus raspa o /metrics do backend; Grafana visualiza. Compartilha a rede
# do compose principal (chaveiro-net). Suba junto com o compose base:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# As portas são publicadas só no loopback (127.0.0.1): acesse via túnel SSH
#   ssh -L 3001:127.0.0.1:3001 -L 9090:127.0.0.1:9090 deploy@SEU_VPS
# e abra http://localhost:3001 (Grafana) / http://localhost:9090 (Prometheus).

networks:
  chaveiro-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: chaveiro-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - chaveiro-net
    ports:
      - '127.0.0.1:9090:9090'

  grafana:
    image: grafana/grafana:latest
    container_name: chaveiro-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - chaveiro-net
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
