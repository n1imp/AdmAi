# Configuração do Prometheus para o ChaveiroBot.
# Raspa o endpoint /metrics do backend (prom-client) pela rede interna do compose.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: chaveiro-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: chaveiro-bot
