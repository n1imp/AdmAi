<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AdmAi" />
    <meta
      name="description"
      content="Registre serviços pelo WhatsApp e acompanhe receita, comissões, estoque e avaliações num painel só. Feito para chaveiros que trabalham em campo."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Fallback PNG: iOS ignora SVG em apple-touch-icon; buscadores preferem raster. [F6-02] -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>AdmAi — Gestão para chaveiros</title>
    <!-- Fontes SELF-HOSTED (src/styles/fonts.css): o CDN do Google recebia o IP do visitante
         ANTES de qualquer consentimento (medido na matriz LGPD). [F6-FONTS-PRECONSENT] -->

    <!-- Social/estruturado da face pública. SEM URLs absolutas: domínio ainda não decidido
         (GO_LIVE A5) — inventar aqui seria mentira indexável. [F6-02] -->
    <!-- Default FAIL-CLOSED: noindex até a página pública (Landing/login/legais) trocar via
         useDocumentHead. Painel privado indexado seria vazamento. [F6-02] -->
    <meta name="robots" content="noindex,nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AdmAi — Gestão para chaveiros" />
    <meta
      property="og:description"
      content="Registre serviços pelo WhatsApp e acompanhe receita, comissões, estoque e avaliações num painel só."
    />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AdmAi",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Gestão para chaveiros: serviços pelo WhatsApp, receita, comissões, estoque e avaliações num painel só."
      }
    </script>
  </head>
  <body class="bg-dark-900 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
