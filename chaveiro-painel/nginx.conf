# nginx do painel: serve a SPA e faz proxy das rotas de API para o backend.
# Espelha o proxy de desenvolvimento do vite.config.js (/api, /health, /uploads, /metrics).

upstream backend {
  # Nome do serviço do backend no docker-compose.
  server backend:3000;
}

# A política vive numa variável porque `add_header` num bloco aninhado DESCARTA todos os
# herdados (semântica do nginx). O `location /assets/` precisa de um `add_header` próprio
# para o Cache-Control e, com isso, perdia CSP e HSTS — ou seja, todo JS/CSS era servido
# sem política nenhuma. Repetir a string à mão nos dois lugares convidaria à divergência;
# o `map` mantém uma fonte única.
map $host $csp_painel {
  default "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://alcdn.msauth.net https://appleid.cdn-apple.com https://client.crisp.chat https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://client.crisp.chat; font-src 'self' https://fonts.gstatic.com https://client.crisp.chat data:; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://appleid.apple.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://client.crisp.chat wss://client.relay.crisp.chat https://*.posthog.com; media-src 'self' https://client.crisp.chat; frame-src https://accounts.google.com https://appleid.apple.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'";
}

map $host $hsts_painel {
  default "max-age=31536000; includeSubDomains";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── HSTS + CSP (Track A / A7) ──────────────────────────────────────────────
  # HSTS — força HTTPS no navegador (o Caddy termina TLS na frente). Sem `preload`
  # de propósito: preload é um compromisso forte (lista do navegador) — adicione só
  # após validar.
  add_header Strict-Transport-Security $hsts_painel always;

  # CSP em ENFORCE (F7). A allow-list foi auditada contra o código, não presumida — a
  # versão anterior (Report-Only) não continha o Crisp (`client.crisp.chat`, injetado no
  # index.html) nem o PostHog (`useAnalytics.js`), então ligar o enforce sem corrigir
  # teria matado o chat de suporte e os analytics em silêncio.
  #
  # Aqui `/api` é proxy same-origin (ver location /api abaixo), por isso `connect-src`
  # não precisa da origem absoluta do backend — diferente da Cloudflare Pages, onde o
  # painel é estático e chama a API cross-origin (ver scripts/gerar-headers.mjs).
  # 'unsafe-inline' em script-src é exigido pelo bootstrap do Crisp no index.html.
  add_header Content-Security-Policy $csp_painel always;

  # Gzip para os assets estáticos.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cache agressivo para assets versionados (hash no nome).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Reenviados porque o add_header acima zera os herdados do server (ver comentário do map).
    add_header Content-Security-Policy $csp_painel always;
    add_header Strict-Transport-Security $hsts_painel always;
    try_files $uri =404;
  }

  # Proxy para o backend.
  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }
  location /uploads/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }
  location /metrics {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }

  # SPA fallback: qualquer rota desconhecida cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
