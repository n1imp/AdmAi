# nginx do painel: serve a SPA e faz proxy das rotas de API para o backend.
# Espelha o proxy de desenvolvimento do vite.config.js (/api, /health, /uploads, /metrics).

upstream backend {
  # Nome do serviço do backend no docker-compose.
  server backend:3000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── HSTS + CSP (Track A / A7) ──────────────────────────────────────────────
  # HSTS — força HTTPS no navegador (o Caddy termina TLS na frente). Sem `preload`
  # de propósito: preload é um compromisso forte (lista do navegador) — adicione só
  # após validar.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # CSP em Report-Only: NÃO bloqueia nada ainda, apenas reporta violações no console
  # do navegador. Valide em staging (clique nos logins Google/Microsoft/Apple e abra
  # o painel inteiro), ajuste a allow-list, e então troque o header para
  # `Content-Security-Policy` (enforce). O host de ingestão do Sentry já está em connect-src.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://alcdn.msauth.net https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://appleid.apple.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://accounts.google.com https://appleid.apple.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Gzip para os assets estáticos.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cache agressivo para assets versionados (hash no nome).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy para o backend.
  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }
  location /uploads/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }
  location /metrics {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }

  # SPA fallback: qualquer rota desconhecida cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
