# nginx do painel: serve a SPA e faz proxy das rotas de API para o backend.
# Espelha o proxy de desenvolvimento do vite.config.js (/api, /health, /uploads, /metrics).

upstream backend {
  # Nome do serviço do backend no docker-compose.
  server backend:3000;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip para os assets estáticos.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cache agressivo para assets versionados (hash no nome).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy para o backend.
  location /api/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }
  location /uploads/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }
  location /metrics {
    proxy_pass http://backend;
    proxy_set_header Host $host;
  }

  # SPA fallback: qualquer rota desconhecida cai no index.html (React Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
