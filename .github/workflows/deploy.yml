name: Deploy

# Dispara APÓS o CI concluir, não direto no push. Antes era `on: push: branches:[master]`
# sem nenhuma dependência do `ci-ok`: um push que deixasse o CI vermelho publicava o painel
# na Cloudflare do mesmo jeito, em paralelo com os testes. O gate `ci-ok` do ci.yml era
# cuidadosamente escrito e simplesmente não era consumido por ninguém no caminho de deploy.
on:
  workflow_run:
    workflows: ['CI']
    branches: [master]
    types: [completed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend → Cloudflare Pages
    runs-on: ubuntu-latest
    # Só publica se o CI daquele commit passou. `workflow_run` dispara também em falha,
    # então a checagem de conclusão é obrigatória — sem ela o gate seria decorativo.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # workflow_run roda no contexto do repo, não do commit testado: fixar o SHA garante
      # que publicamos exatamente o que o CI aprovou, e não o topo do master naquele instante.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          # Alinhado ao Node do ci.yml. Estava em 22 enquanto o CI valida em 20, ou seja,
          # o artefato publicado era construído numa versão que nenhum job testa — e
          # diferenças de ICU entre majors afetam Intl/formatação de moeda e data.
          node-version: '20'
          cache: npm
          cache-dependency-path: chaveiro-painel/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: chaveiro-painel

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_CRISP_ID: ${{ secrets.VITE_CRISP_ID }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: https://app.posthog.com
        run: npm run build
        working-directory: chaveiro-painel

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy chaveiro-painel/dist --project-name=admai-painel --branch=master
