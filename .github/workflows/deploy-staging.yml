name: Deploy Staging

# STG-APP-STAGING-01 (D1 01a038e5) + STG-APP-DEPLOY-01 (D1 01a03b55): este workflow
# é o ÚNICO WRITER do preview fixo `staging` do painel. O preview nativo da branch
# `staging` é excluído ANTES do primeiro push pelo one-shot cf-preview-guard.yml
# (tag técnica autorizada por D2) — aqui só VERIFICAMOS a exclusão (defesa em
# profundidade sem segundo writer de config).
#
# SECRETS [D2 literal do usuário via AskUserQuestion: "Reusar os do repo"]:
# usa deliberadamente os secrets de REPO CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID
# (os mesmos que já publicam previews deste projeto). A proteção contra publicar
# produção NÃO é o nome do secret: é o guard nunca-master + `--branch=staging` fixo
# + guards de config/artefato + gate ci-ok. Risco residual documentado em
# STG_APP_SECRET_MATRIX.md. VITE_API_URL_STAGING é PUBLIC_CONFIG → repo VARIABLE
# (vars.VITE_API_URL_STAGING), com validação fail-closed.
#
# GATE ci-ok [D1 01a03b55 ponto 4]: o publish só ocorre com o check `ci-ok` VERDE
# para o SHA exato (push dispara CI e este workflow em paralelo — sem o gate, um
# push vermelho publicaria staging).

on:
  workflow_dispatch:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  checks: read
  contents: read

jobs:
  deploy-frontend-staging:
    name: Painel → Cloudflare Pages (branch preview `staging`)
    runs-on: ubuntu-latest
    environment: staging
    # Guard 1 — NUNCA rodar sobre master/produção (nem via dispatch acidental).
    if: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      # Guard 2 — config: VITE_API_URL_STAGING (repo VARIABLE) presente e não-produção.
      - name: Guard anti-produção (config)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING }}
        run: |
          set -eu
          if [ -z "${VITE_API_URL:-}" ]; then
            echo "::error::vars.VITE_API_URL_STAGING ausente — defina com gh variable set VITE_API_URL_STAGING -b https://<backend-staging>/api (após o bootstrap do backend)."; exit 1; fi
          case "$VITE_API_URL" in
            *disljhkypaxpyzvbooge*|*api.chaveirobot.com.br*|*admai-production.up.railway.app*)
              echo "::error::VITE_API_URL_STAGING aponta para PRODUÇÃO — abortado."; exit 1;;
          esac
          echo "guard config ok (alvo não é produção)."

      # Guard 3 — VERIFICAR (read-only) que `staging` está excluída do preview nativo.
      # A EXCLUSÃO em si é feita pelo one-shot cf-preview-guard.yml ANTES do primeiro
      # push (D1: writer único de config; aqui só se prova a pós-condição).
      - name: Verificar exclusão do preview nativo (read-only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          atual=$(curl -sf -H "Authorization: Bearer ${CF_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/admai-painel")
          jq -e '.result.source.config.preview_branch_excludes | index("staging") != null' <<<"$atual" >/dev/null \
            || { echo "::error::branch staging NÃO está excluída do preview nativo — rode o cf-preview-guard (tag ops/cf-preview-guard-*) antes de publicar."; exit 1; }
          pb=$(jq -r '.result.production_branch // .result.source.config.production_branch // empty' <<<"$atual")
          [ "$pb" = "master" ] || { echo "::error::production_branch != master (${pb}) — investigar."; exit 1; }
          echo "exclusão confirmada; production_branch=master."

      # Gate ci-ok — espera o check do SHA exato ficar VERDE (até ~15 min).
      - name: Gate ci-ok (mesmo SHA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha="${{ github.sha }}"
          echo "aguardando check ci-ok @ ${sha}..."
          for i in $(seq 1 45); do
            estado=$(gh api "repos/${{ github.repository }}/commits/${sha}/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci-ok")] | if length == 0 then "ausente" else .[0].status + ":" + (.[0].conclusion // "pendente") end' 2>/dev/null || echo "erro")
            echo "  tentativa ${i}: ${estado}"
            case "$estado" in
              completed:success) echo "ci-ok VERDE."; exit 0;;
              completed:*) echo "::error::ci-ok concluiu SEM sucesso (${estado}) — publish bloqueado."; exit 1;;
            esac
            sleep 20
          done
          echo "::error::ci-ok não concluiu a tempo — publish bloqueado (re-rode quando o CI ficar verde)."
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: chaveiro-painel/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: chaveiro-painel

      # Guard 4 (fail-closed, mesmo binário do dev local): build:staging roda
      # scripts/guard-frontend-build.mjs ANTES do vite build — https obrigatório,
      # path EXATAMENTE /api (contrato API_BASE_WITH_PREFIX), nega produção/
      # localhost/placeholder/vazio. Depois, vite build + gerar-headers (CSP).
      - name: Build staging (guard + build + CSP)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING }}
        run: npm run build:staging
        working-directory: chaveiro-painel

      # Guard 5 — o ARTEFATO buildado precisa provar o alvo: o connect-src do
      # _headers deve conter a origem staging da API e NÃO conter produção.
      - name: Guard anti-produção (artefato)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_STAGING }}
        run: |
          set -eu
          test -f chaveiro-painel/dist/_headers
          ORIGEM_API=$(node -e "console.log(new URL(process.env.VITE_API_URL).origin)")
          grep -qF "$ORIGEM_API" chaveiro-painel/dist/_headers \
            || { echo "::error::_headers sem a origem da API staging ($ORIGEM_API) no connect-src."; exit 1; }
          if grep -qE "api\.chaveirobot\.com\.br|admai-production\.up\.railway\.app|disljhkypaxpyzvbooge" \
               chaveiro-painel/dist/_headers; then
            echo "::error::_headers contém origem de PRODUÇÃO — abortado."; exit 1; fi
          echo "artefato ok: connect-src aponta para staging."

      - name: Publish preview `staging`
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=staging é OBRIGATÓRIO e fixo: publica o alias
          # staging.admai-painel.pages.dev, nunca o domínio de produção.
          command: pages deploy chaveiro-painel/dist --project-name=admai-painel --branch=staging
