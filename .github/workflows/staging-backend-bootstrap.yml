name: Staging Backend Bootstrap

# STG-APP-DEPLOY-01 · D1 D-STG-APP-DEPLOY-EXEC-01 (thread 01a03b55, ponto 2).
# Bootstrap BIFÁSICO do backend staging em projeto Railway DEDICADO `admai-staging`
# (nunca localiza/toca o projeto de produção). Custo do serviço E do Redis foram
# AUTORIZADOS pelo usuário (D2 literal via AskUserQuestion) — o input confirm_cost
# registra essa autorização em cada dispatch.
#
#   phase=prepare : projeto + environment staging + service SEM source + Redis +
#                   domínio + vars NÃO-secretas. Nenhum deploy dispara.
#   phase=connect : (depois que o USUÁRIO preencher as vars SECRETAS no dashboard)
#                   conecta n1imp/AdmAi#staging root=chaveiro-bot + healthcheck.
#
# Toda a lógica (introspecção fail-closed, guards anti-produção, inventário de IDs,
# nunca ecoar token/valores) vive em tools/railway-staging-bootstrap.mjs — testada
# por selftest com fetch injetado (7/7).

on:
  # REGISTRO: workflow_dispatch só funciona depois que o GitHub registra o workflow
  # (arquivo na default branch OU um run por outro evento). Como master é intocável,
  # a tag técnica ops/railway-bootstrap-register-* dispara UM run inofensivo
  # (só selftest; zero mutação — o guard abaixo força phase=register em evento de tag)
  # que registra o workflow; daí em diante o dispatch normal com --ref staging funciona.
  push:
    tags: ['ops/railway-bootstrap-register-*']
  workflow_dispatch:
    inputs:
      confirm_cost:
        description: 'Digite "yes" confirmando a autorização D2 de custo (serviço + Redis staging)'
        required: true
      phase:
        description: 'prepare | internal-secrets | external-secrets | connect | logs (read-only)'
        required: true
        default: 'prepare'
      project_id:
        description: '(connect/rerun) projectId do output do prepare'
        required: false
      environment_id:
        description: '(connect) environmentId do output do prepare'
        required: false
      service_id:
        description: '(connect) serviceId do output do prepare'
        required: false
      workspace_id:
        description: '(prepare) workspaceId — só se o token tiver mais de um workspace'
        required: false
      force_names:
        description: '(external-secrets) nomes de SECRETOS_EXTERNOS a re-upsertar mesmo se presentes (recuperação de valor errado no dashboard; ex.: SUPABASE_SERVICE_ROLE_KEY)'
        required: false

# contents:read é o mínimo p/ o checkout do repo privado (permissions vazio quebrava
# o actions/checkout com "repository not found" — visto no run de registro).
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Environment staging: dá acesso aos secrets *_STAGING (transferência OPACA —
    # gh secret set --env staging alimenta; a fase external-secrets upserta no
    # Railway DENTRO do runner; valores nunca transitam pelo agente/chat/logs).
    environment: staging
    steps:
      - name: Guard de autorização (D2 registrado no dispatch; tag = só registro)
        id: fase
        # [REVISOR 01a044bb-final] Inputs também aqui via env — nunca inline no run. Um input com
        # $()/backtick interpolado poderia persistir payload em $GITHUB_ENV/runner e ser alcançado
        # pelo step posterior que recebe RAILWAY_TOKEN e STG_*. Como env vars, os valores são literais.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CONFIRM_COST: ${{ inputs.confirm_cost }}
          INPUT_PHASE: ${{ inputs.phase }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "push" ]; then
            # Run de REGISTRO (tag técnica): nenhuma mutação; só o selftest abaixo roda.
            echo "phase=register" >> "$GITHUB_OUTPUT"
            echo "run de registro — nenhuma chamada à API do Railway."
            exit 0
          fi
          if [ "$INPUT_CONFIRM_COST" != "yes" ]; then
            echo "::error::confirm_cost != 'yes' — sem a confirmação literal do D2 de custo, nada é criado."
            exit 1
          fi
          case "$INPUT_PHASE" in prepare|connect|internal-secrets|external-secrets|logs) ;; *)
            echo "::error::phase deve ser prepare, internal-secrets, external-secrets, connect ou logs."; exit 1;; esac
          echo "phase=$INPUT_PHASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Selftest do bootstrap (fetch injetado — API real intocada)
        run: node tools/railway-staging-bootstrap.mjs --selftest

      - name: Executar fase
        if: ${{ steps.fase.outputs.phase != 'register' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # [REVISOR 01a044bb achado 1] Inputs vão para o AMBIENTE (nunca interpolados no shell):
          # `${{ inputs.X }}` inline no `run` executaria `$(...)`/backticks do input ANTES dos
          # controles do Node — com RAILWAY_TOKEN e os STG_* no escopo. Como env vars, o valor é
          # literal; o script os cita um a um num array. defense-in-depth mesmo com IDs = UUID.
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_PROJECT_ID: ${{ inputs.project_id }}
          INPUT_ENVIRONMENT_ID: ${{ inputs.environment_id }}
          INPUT_SERVICE_ID: ${{ inputs.service_id }}
          INPUT_WORKSPACE_ID: ${{ inputs.workspace_id }}
          INPUT_FORCE_NAMES: ${{ inputs.force_names }}
          # STG_* só existem no ambiente na fase external-secrets (a única que os lê); nas demais
          # fases (prepare/connect/internal-secrets/logs) ficam vazios — reduz a superfície.
          STG_DATABASE_URL: ${{ inputs.phase == 'external-secrets' && secrets.DATABASE_URL_STAGING || '' }}
          STG_DIRECT_URL: ${{ inputs.phase == 'external-secrets' && secrets.DIRECT_URL_STAGING || '' }}
          STG_SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.phase == 'external-secrets' && secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING || '' }}
          STG_RESEND_API_KEY: ${{ inputs.phase == 'external-secrets' && secrets.RESEND_API_KEY_STAGING || '' }}
        run: |
          # pipefail OBRIGATÓRIO [REVISOR 01a03bb9 achado 1]: sem ele, o status do
          # pipe é o do `tee` e um bootstrap que sai 1 viraria step VERDE.
          set -euo pipefail
          args=(--phase="$INPUT_PHASE")
          [ -n "$INPUT_PROJECT_ID" ] && args+=(--project-id="$INPUT_PROJECT_ID")
          [ -n "$INPUT_ENVIRONMENT_ID" ] && args+=(--environment-id="$INPUT_ENVIRONMENT_ID")
          [ -n "$INPUT_SERVICE_ID" ] && args+=(--service-id="$INPUT_SERVICE_ID")
          [ -n "$INPUT_WORKSPACE_ID" ] && args+=(--workspace-id="$INPUT_WORKSPACE_ID")
          [ -n "$INPUT_FORCE_NAMES" ] && args+=(--force-names="$INPUT_FORCE_NAMES")
          node tools/railway-staging-bootstrap.mjs "${args[@]}" | tee saida.txt
          {
            echo "## Staging Backend Bootstrap — ${INPUT_PHASE}"
            echo '```'
            cat saida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
