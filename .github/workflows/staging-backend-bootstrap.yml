name: Staging Backend Bootstrap

# STG-APP-DEPLOY-01 · D1 D-STG-APP-DEPLOY-EXEC-01 (thread 01a03b55, ponto 2).
# Bootstrap BIFÁSICO do backend staging em projeto Railway DEDICADO `admai-staging`
# (nunca localiza/toca o projeto de produção). Custo do serviço E do Redis foram
# AUTORIZADOS pelo usuário (D2 literal via AskUserQuestion) — o input confirm_cost
# registra essa autorização em cada dispatch.
#
#   phase=prepare : projeto + environment staging + service SEM source + Redis +
#                   domínio + vars NÃO-secretas. Nenhum deploy dispara.
#   phase=connect : (depois que o USUÁRIO preencher as vars SECRETAS no dashboard)
#                   conecta n1imp/AdmAi#staging root=chaveiro-bot + healthcheck.
#
# Toda a lógica (introspecção fail-closed, guards anti-produção, inventário de IDs,
# nunca ecoar token/valores) vive em tools/railway-staging-bootstrap.mjs — testada
# por selftest com fetch injetado (7/7).

on:
  # REGISTRO: workflow_dispatch só funciona depois que o GitHub registra o workflow
  # (arquivo na default branch OU um run por outro evento). Como master é intocável,
  # a tag técnica ops/railway-bootstrap-register-* dispara UM run inofensivo
  # (só selftest; zero mutação — o guard abaixo força phase=register em evento de tag)
  # que registra o workflow; daí em diante o dispatch normal com --ref staging funciona.
  push:
    tags: ['ops/railway-bootstrap-register-*']
  workflow_dispatch:
    inputs:
      confirm_cost:
        description: 'Digite "yes" confirmando a autorização D2 de custo (serviço + Redis staging)'
        required: true
      phase:
        description: 'prepare | internal-secrets | external-secrets | connect'
        required: true
        default: 'prepare'
      project_id:
        description: '(connect/rerun) projectId do output do prepare'
        required: false
      environment_id:
        description: '(connect) environmentId do output do prepare'
        required: false
      service_id:
        description: '(connect) serviceId do output do prepare'
        required: false
      workspace_id:
        description: '(prepare) workspaceId — só se o token tiver mais de um workspace'
        required: false

# contents:read é o mínimo p/ o checkout do repo privado (permissions vazio quebrava
# o actions/checkout com "repository not found" — visto no run de registro).
permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Environment staging: dá acesso aos secrets *_STAGING (transferência OPACA —
    # gh secret set --env staging alimenta; a fase external-secrets upserta no
    # Railway DENTRO do runner; valores nunca transitam pelo agente/chat/logs).
    environment: staging
    steps:
      - name: Guard de autorização (D2 registrado no dispatch; tag = só registro)
        id: fase
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            # Run de REGISTRO (tag técnica): nenhuma mutação; só o selftest abaixo roda.
            echo "phase=register" >> "$GITHUB_OUTPUT"
            echo "run de registro — nenhuma chamada à API do Railway."
            exit 0
          fi
          if [ "${{ inputs.confirm_cost }}" != "yes" ]; then
            echo "::error::confirm_cost != 'yes' — sem a confirmação literal do D2 de custo, nada é criado."
            exit 1
          fi
          case "${{ inputs.phase }}" in prepare|connect|internal-secrets|external-secrets) ;; *)
            echo "::error::phase deve ser prepare, internal-secrets, external-secrets ou connect."; exit 1;; esac
          echo "phase=${{ inputs.phase }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Selftest do bootstrap (fetch injetado — API real intocada)
        run: node tools/railway-staging-bootstrap.mjs --selftest

      - name: Executar fase
        if: ${{ steps.fase.outputs.phase != 'register' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Fase external-secrets (só nela são lidos): secrets do Environment staging.
          # Ausentes ⇒ a fase reporta ausentesNoRunner por NOME (nunca valores).
          STG_DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          STG_DIRECT_URL: ${{ secrets.DIRECT_URL_STAGING }}
          STG_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
          STG_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_STAGING }}
        run: |
          # pipefail OBRIGATÓRIO [REVISOR 01a03bb9 achado 1]: sem ele, o status do
          # pipe é o do `tee` e um bootstrap que sai 1 viraria step VERDE.
          set -euo pipefail
          ARGS="--phase=${{ inputs.phase }}"
          [ -n "${{ inputs.project_id }}" ] && ARGS="$ARGS --project-id=${{ inputs.project_id }}"
          [ -n "${{ inputs.environment_id }}" ] && ARGS="$ARGS --environment-id=${{ inputs.environment_id }}"
          [ -n "${{ inputs.service_id }}" ] && ARGS="$ARGS --service-id=${{ inputs.service_id }}"
          [ -n "${{ inputs.workspace_id }}" ] && ARGS="$ARGS --workspace-id=${{ inputs.workspace_id }}"
          node tools/railway-staging-bootstrap.mjs $ARGS | tee saida.txt
          {
            echo "## Staging Backend Bootstrap — ${{ inputs.phase }}"
            echo '```'
            cat saida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
