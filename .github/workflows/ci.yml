name: CI

on:
  push:
    # `staging` incluída [STG-APP-DEPLOY-01, D1 01a03b55 ponto 4]: dá `ci-ok` real
    # para o gate do Deploy Staging e para o Wait-for-CI do Railway staging.
    # O deploy de PRODUÇÃO não é afetado: deploy.yml só consome workflow_run de master.
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

# Cancela runs superados do mesmo branch/PR (economiza minutos e dá feedback mais rápido).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Token com o mínimo. `pull-requests: read` é EXIGIDO pelo dorny/paths-filter (job
# 'changes') p/ ler os arquivos alterados do PR — sem isto dá "Resource not accessible
# by integration" (403), o job 'changes' falha e o gate reprova.
permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Detecta o que mudou: backend e/ou painel (evita rodar tudo em todo PR) ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codexpolicy: ${{ steps.filter.outputs.codexpolicy }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'chaveiro-bot/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'chaveiro-painel/**'
              - '.github/workflows/ci.yml'
            codexpolicy:
              - 'tools/codex-policy/**'
              - '.github/workflows/ci.yml'

  # ── Política de aprovação do Codex (MCP). Sem dependências: node --test puro. ──
  #    O shim que a consome vive em `.claude/` (fora do versionamento, específico
  #    da máquina); a DECISÃO é versionada aqui e precisa de gate próprio.
  codex-policy:
    needs: changes
    if: needs.changes.outputs.codexpolicy == 'true'
    # windows-latest de propósito: as asserções de caminho usam semântica do
    # Windows (letra de unidade, separador `\`, nome curto 8.3), que é a
    # plataforma onde o Codex MCP roda. Em Linux, `C:\Windows\...` seria lido
    # como caminho RELATIVO e cairia DENTRO da raiz — os testes de "fora da
    # worktree" passariam a afirmar o contrário do que pretendem.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Glob explícito: passar o diretório faz o runner tratá-lo como módulo.
      - name: Testes da política de aprovação
        run: node --test tools/codex-policy/*.test.mjs

  # ── Backend: lint + testes unitários + integração (Postgres) + audit ───────
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaveiro-bot
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chaveiro
          POSTGRES_PASSWORD: chaveiro123
          POSTGRES_DB: admai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaveiro -d admai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://chaveiro:chaveiro123@localhost:5432/admai_test
      DIRECT_URL: postgresql://chaveiro:chaveiro123@localhost:5432/admai_test
      NODE_ENV: test
      API_TOKEN: ci-api-token
      JWT_SECRET: ci-jwt-secret-0123456789-0123456789-0123456789
      ENCRYPTION_KEY: ci-encryption-key-for-testing-only-32ch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chaveiro-bot/package-lock.json

      # Alinha o npm à versão que gerou os lockfiles (resolve ranges OR de forma idêntica).
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx prisma generate

      # Trava drift schema↔migrations: aplica as migrations num Postgres limpo e
      # compara com o schema.prisma. Pega o caso B7/B8 (tabela/índice que o schema
      # declara mas nenhuma migration cria, ou vice-versa) — que `migrate status`
      # NÃO detecta. Falha (exit 2) se houver divergência.
      - name: Drift schema x migrations (prisma migrate diff)
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Lint (ESLint)
        run: npm run lint

      # Gate de tipos. `checkJs` é false: só entram os arquivos com `// @ts-check`,
      # então o gate bloqueia de verdade sem carregar a dívida pré-existente.
      # Cada arquivo anotado passa a ser verificado a partir daqui.
      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      # Gate de formatação (Prettier). O backend foi normalizado globalmente (F9/M6);
      # cobre src/ e test/. O job frontend ainda não tem este gate (normalização própria).
      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes unitários + cobertura (v8)
        run: npm run test:coverage

      - name: Testes de integração (Supertest + Postgres)
        run: npm run test:integration

      # Falha em High+, exceto exceções explícitas e auditáveis em scripts/audit-allowlist.json
      # (só o GHSA ID + pacote exatos, com justificativa e data de revisão — nunca o pacote
      # inteiro nem um bypass genérico). Ver scripts/audit-gate.mjs.
      - name: Auditoria de dependências (High+, exceções documentadas)
        run: |
          npm audit --json > audit-report.json || true
          node scripts/audit-gate.mjs audit-report.json

  # ── Backend: smoke do Docker build (pega quebra do Dockerfile antes do Railway) ──
  docker-build:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem de produção
        run: docker build -t admai-bot:ci ./chaveiro-bot

  # ── Frontend: lint + testes + build de produção + audit ────────────────────
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chaveiro-painel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: chaveiro-painel/package-lock.json

      # Alinha o npm à versão que gerou os lockfiles (resolve ranges OR de forma idêntica).
      - run: npm install -g npm@11
      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      # Gate de tipos. Ver nota no job do backend: só arquivos com `// @ts-check`.
      - name: Tipos (tsc --noEmit)
        run: npm run typecheck

      # Gate de formatação (Prettier) do painel. O frontend foi normalizado globalmente
      # (commit style(painel), registrado em .git-blame-ignore-revs) → o gate agora é seguro.
      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes (Vitest + RTL) + cobertura (v8)
        run: npm run test:coverage

      # Acessibilidade automatizada (axe-core), F9/M6. BLOQUEANTE: a suite cobre os
      # primitives + as telas F9 (M1-M4) e esta estavel/verde (0 violacoes serias/criticas).
      # Cobre o subconjunto estrutural (labels, nomes acessiveis, ARIA, roles); contraste/
      # foco/teclado ficam com o harness CDP (validate.mjs). Roda so os *.axe.jsx.
      - name: Acessibilidade (axe-core) — bloqueante
        run: npm run test:a11y

      - name: Build de produção
        run: npm run build

      # E2E (Chrome headless + CDP) dos fluxos F9 — NAO-bloqueante no inicio (sobe p/
      # bloqueante por marco, como o axe fez). O harness (e2e/run.mjs) sobe um servidor
      # que serve o build + mocka /api, entao o build precisa da API RELATIVA (VITE_API_URL=/api).
      # O runner ubuntu ja traz o google-chrome-stable, detectado por acharChrome().
      - name: E2E (Chrome/CDP) — nao-bloqueante
        run: VITE_API_URL=/api npm run build && npm run e2e
        continue-on-error: true

      - name: Auditoria de dependências (falha em High+)
        run: npm audit --audit-level=high --omit=dev

  # ── Gate estável p/ branch protection: exige `ci-ok` (1 check só). Passa quando
  #    todo job necessário passou OU foi pulado (path filter); falha se algum falhou. ──
  ci-ok:
    if: always()
    needs: [changes, backend, docker-build, frontend, codex-policy]
    runs-on: ubuntu-latest
    steps:
      - name: Verifica resultado dos jobs
        run: |
          # 'changes' PRECISA ter sucesso: se ele falha, backend/frontend/docker são
          # 'skipped' (não 'failure'), e o gate passaria em FALSO — os testes nem rodam.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Job 'changes' nao teve sucesso (${{ needs.changes.result }}) — os testes podem ter sido pulados. Gate reprovado."
            exit 1
          fi
          results="${{ needs.backend.result }} ${{ needs.docker-build.result }} ${{ needs.frontend.result }} ${{ needs.codex-policy.result }}"
          echo "Resultados: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Um job do CI falhou ($r)."
              exit 1
            fi
          done
          echo "CI verde ✓"
